name: Ruff Fix Preview

on:
  push:
    branches:
      - refactor/outlook-asset-read-model-20260828

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching Ruff
        run: pip install ruff==0.16.5
      - name: Show canonical Ruff fixes
        run: |
          ruff check \
            backend/app/core/rate_limiter.py \
            backend/app/schemas/outlook_accounts.py \
            tests/backend/test_outlook_asset_views.py \
            --fix || true
          git diff -- \
            backend/app/core/rate_limiter.py \
            backend/app/schemas/outlook_accounts.py \
            tests/backend/test_outlook_asset_views.py
